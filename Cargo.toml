[package]
name = "sootmark-winlogs"
version = "0.4.0"
edition = "2021"
rust-version = "1.80"
description = "Windows text logs for forensics: Program Compatibility Assistant (execution, Windows 11), IIS and Windows Firewall (W3C), PowerShell transcripts, TeamViewer logs and connections, setupapi (device installs), SCCM client logs, AnyDesk traces, ScreenConnect client settings and server session databases, and Windows Error Reporting reports."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Sootmark/winlogs"
homepage = "https://sootmark.com"
keywords = ["forensics", "dfir", "incident-response", "windows", "logs"]
# Sources only: test fixtures stay in the repository.
include = ["/src", "/README.md", "/LICENSE-APACHE", "/LICENSE-MIT"]

[lib]
name = "winlogs"

[dependencies]
common = { package = "sootmark-common", version = "0.3.7" }
sqlite = { package = "sootmark-sqlite", version = "0.2.0" }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
